<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Hills - Scenario Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #9da398;
            --accent: #4a5d3a;
            --text-dark: #1a1a1a;
            --text-medium: #444;
            --text-light: #666;
            --white: #ffffff;
            --border: #e0e0e0;
            --success: #556b2f;
            --warning: #b8860b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -1px;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .subtitle {
            color: var(--text-medium);
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .controls {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .control-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .control-group select {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            background: white;
            color: var(--text-dark);
        }

        .control-group select:focus {
            border-color: var(--accent);
            outline: none;
        }

        .generate-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .generate-btn:hover {
            background: #3a4d2a;
            transform: translateY(-2px);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: var(--text-medium);
            font-style: italic;
            padding: 20px;
        }

        .scenario-output {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .scenario-output.active {
            display: block;
        }

        .ij-code-section {
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
        }

        .ij-code-header {
            background: var(--accent);
            color: white;
            padding: 15px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .copy-btn.copied {
            background: var(--success);
            border-color: var(--success);
        }

        .ij-code-textarea {
            width: 100%;
            height: 300px;
            border: none;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            resize: vertical;
            background: white;
            color: var(--text-dark);
        }

        .ij-code-textarea:focus {
            outline: none;
            background: #fffef7;
        }

        .scenario-header {
            background: var(--accent);
            color: white;
            padding: 25px 30px;
        }

        .mission-info {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scenario-title {
            font-size: 1.8rem;
            font-weight: 500;
        }

        .scenario-body {
            padding: 30px;
        }

        .scenario-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .scenario-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .section-title {
            color: var(--accent);
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .section-content {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-medium);
        }

        .highlight {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid var(--accent);
            border-radius: 0 4px 4px 0;
            margin: 15px 0;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            border-left: 4px solid var(--success);
        }

        @media (max-width: 768px) {
            .control-row {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SCENARIO GENERATOR</h1>
            <p class="subtitle">Modular Mission Creation for Obsidian Hills</p>
        </header>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="objective-select">Mission Objective</label>
                    <select id="objective-select">
                        <option value="">Loading objectives...</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="location-select">Target Location</label>
                    <select id="location-select">
                        <option value="">Loading locations...</option>
                    </select>
                </div>
            </div>
            
            <button class="generate-btn" id="generate-btn" onclick="generateScenario()" disabled>
                Generate Scenario
            </button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Generating scenario...
        </div>

        <div id="error-message" class="error" style="display: none;"></div>

        <div class="scenario-output" id="scenario-output">
            <!-- Generated scenario will appear here -->
        </div>
    </div>

    <script>
        let gameData = {
            objectives: [],
            locations: [],
            challenges: [],
            complications: [],
            opportunities: []
        };

        let dataLoaded = false;

        // Load all text files on page load
        async function loadGameData() {
            const files = [
                'data/objectives.txt',
                'data/locations.txt', 
                'data/challenges.txt',
                'data/complications.txt',
                'data/opportunities.txt'
            ];

            const keys = ['objectives', 'locations', 'challenges', 'complications', 'opportunities'];

            try {
                const promises = files.map(file => fetch(file).then(r => r.text()));
                const results = await Promise.all(promises);

                results.forEach((text, index) => {
                    const key = keys[index];
                    gameData[key] = text.split('\n')
                        .map(line => line.trim())
                        .filter(line => line.length > 0 && !line.startsWith('#')); // Allow comments with #
                });

                populateDropdowns();
                dataLoaded = true;
                document.getElementById('generate-btn').disabled = false;
                
                // Success message
                showMessage('success', `Data loaded successfully! ${gameData.objectives.length} objectives, ${gameData.locations.length} locations, ${gameData.challenges.length} challenges, ${gameData.complications.length} complications, ${gameData.opportunities.length} opportunities.`);
                
            } catch (error) {
                console.error('Error loading data:', error);
                showError(`Failed to load scenario data. Make sure all files are in the 'data' folder: ${error.message}`);
            }
        }

        function populateDropdowns() {
            const objectiveSelect = document.getElementById('objective-select');
            const locationSelect = document.getElementById('location-select');

            // Clear existing options
            objectiveSelect.innerHTML = '<option value="">Choose your mission...</option>';
            locationSelect.innerHTML = '<option value="">Choose your destination...</option>';

            // Populate objectives
            gameData.objectives.forEach(objective => {
                const option = document.createElement('option');
                option.value = objective;
                option.textContent = objective;
                objectiveSelect.appendChild(option);
            });

            // Populate locations
            gameData.locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationSelect.appendChild(option);
            });
        }

        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generateScenario() {
            if (!dataLoaded) {
                showError('Data not loaded yet. Please wait...');
                return;
            }

            const objective = document.getElementById('objective-select').value;
            const location = document.getElementById('location-select').value;

            if (!objective || !location) {
                showError('Please select both an objective and a location.');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('scenario-output').classList.remove('active');

            // Simulate brief loading time for effect
            setTimeout(() => {
                const challenge = getRandomElement(gameData.challenges);
                const complication = getRandomElement(gameData.complications);
                const opportunity = getRandomElement(gameData.opportunities);

                displayScenario(objective, location, challenge, complication, opportunity);
                
                document.getElementById('loading').style.display = 'none';
            }, 800);
        }

        function displayScenario(objective, location, challenge, complication, opportunity) {
            const output = document.getElementById('scenario-output');

            // Generate InsaneJournal compatible code
            const ijCode = generateIJCode(objective, location, challenge, complication, opportunity);

            output.innerHTML = `
                <div class="scenario-header">
                    <div class="mission-info">Mission Generated</div>
                    <div class="scenario-title">${objective} - ${location}</div>
                </div>
                <div class="scenario-body">
                    <div class="scenario-section">
                        <div class="section-title">Primary Challenge</div>
                        <div class="section-content">${challenge}</div>
                    </div>
                    
                    <div class="scenario-section">
                        <div class="section-title">Complication</div>
                        <div class="section-content">${complication}</div>
                    </div>
                    
                    <div class="scenario-section">
                        <div class="section-title">Opportunity</div>
                        <div class="section-content highlight">${opportunity}</div>
                    </div>
                    
                    <div class="ij-code-section">
                        <div class="ij-code-header">
                            <span>InsaneJournal Compatible Code</span>
                            <button class="copy-btn" onclick="copyIJCode(this)">Copy Code</button>
                        </div>
                        <textarea class="ij-code-textarea" readonly id="ij-code-output">${ijCode}</textarea>
                    </div>
                </div>
            `;

            output.classList.add('active');
            output.scrollIntoView({ behavior: 'smooth' });
            hideMessages();
        }

        function generateIJCode(objective, location, challenge, complication, opportunity) {
            // Generate IJ/DW compatible HTML following the design guidelines
            return `<lj-raw>
<center>
<div style="width: 800px; background: #2c3e2d; border: 2px solid #4a5d3a; border-radius: 8px; margin: 20px 0; line-height: 1.2;">
    
    <!-- Mission Header -->
    <div style="background: linear-gradient(135deg, #4a5d3a, #2c3e2d); padding: 25px; text-align: center; border-radius: 6px 6px 0 0;">
        <div style="color: #c4a885; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 8px 0; line-height: 1.2;">Mission Generated</div>
        <div style="color: #ffffff; font-size: 24px; font-weight: bold; margin: 0; line-height: 1.2;">${objective}</div>
        <div style="color: #9da398; font-size: 18px; margin: 8px 0 0 0; line-height: 1.2;">${location}</div>
    </div>
    
    <!-- Mission Content -->
    <div style="padding: 30px;">
        
        <!-- Challenge Section -->
        <div style="background: rgba(139, 69, 19, 0.1); border-left: 4px solid #8b4513; padding: 20px; margin: 0 0 20px 0; border-radius: 0 4px 4px 0;">
            <div style="color: #8b4513; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; line-height: 1.2;">⚠️ Primary Challenge</div>
            <div style="color: #2c3e2d; font-size: 16px; margin: 0; line-height: 1.5;">${challenge}</div>
        </div>
        
        <!-- Complication Section -->
        <div style="background: rgba(184, 134, 11, 0.1); border-left: 4px solid #b8860b; padding: 20px; margin: 0 0 20px 0; border-radius: 0 4px 4px 0;">
            <div style="color: #b8860b; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; line-height: 1.2;">⚡ Complication</div>
            <div style="color: #2c3e2d; font-size: 16px; margin: 0; line-height: 1.5;">${complication}</div>
        </div>
        
        <!-- Opportunity Section -->
        <div style="background: rgba(85, 107, 47, 0.1); border-left: 4px solid #556b2f; padding: 20px; margin: 0; border-radius: 0 4px 4px 0;">
            <div style="color: #556b2f; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px 0; line-height: 1.2;">✦ Opportunity</div>
            <div style="color: #2c3e2d; font-size: 16px; margin: 0; line-height: 1.5;">${opportunity}</div>
        </div>
        
    </div>
    
    <!-- Footer -->
    <div style="background: rgba(74, 93, 58, 0.3); padding: 15px; text-align: center; border-radius: 0 0 6px 6px; border-top: 1px solid rgba(74, 93, 58, 0.2);">
        <div style="color: #4a5d3a; font-size: 12px; margin: 0; line-height: 1.2;">Generated by Obsidian Hills Scenario Generator</div>
    </div>
    
</div>
</center>
</lj-raw>`;
        }

        function copyIJCode(button) {
            const textarea = document.getElementById('ij-code-output');
            textarea.select();
            document.execCommand('copy');
            
            // Visual feedback
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showMessage(type, message) {
            // Remove existing message elements
            const existing = document.querySelector('.success, .error');
            if (existing) existing.remove();

            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            const controls = document.querySelector('.controls');
            controls.parentNode.insertBefore(messageDiv, controls.nextSibling);

            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.remove();
                    }
                }, 5000);
            }
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Load data when page loads
        window.addEventListener('load', loadGameData);
    </script>
</body>
</html>
